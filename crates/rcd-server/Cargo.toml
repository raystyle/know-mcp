[package]
name = "rcd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local daemon MCP server for hybrid search over archived code and documents"

[[bin]]
name = "rcd-mcp-server"
path = "src/main.rs"

[dependencies]
rcd-core = { path = "../rcd-core" }
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-streamable-http-server"] }
zvec-rust = "0.8.1"
zvec-rust-build = "0.8.1"
interprocess = { version = "2", features = ["tokio"] }
futures-lite = "2"
dunce = "1"
chrono = { workspace = true }
libc = "0.2"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }

[build-dependencies]
zvec-rust-build = "0.8.1"
