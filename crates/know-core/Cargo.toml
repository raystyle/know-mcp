[package]
name = "know-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hybrid keyword+vector search core for archived code and documents"

[dependencies]
zvec-rust = "0.8.1"
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da", features = ["cuda-no-vmm"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
ignore = "0.4"
dunce = "1"
# Document extraction (reader_rs heritage): anydoc unified engine for the
# office family, pdf-inspector layout pipeline for PDF, hayro page
# rendering, ppocr-rs PP-OCRv6 OCR kernel (same rev pin as reader_rs).
anydoc = "0.2.4"
pdf-inspector = "1"
hayro = "0.7"
ppocr-rs = { git = "https://github.com/weidix/ppocr-rs", rev = "d07857c35457f90bb8df92e245f614cdc3d5e236" }
image = "0.25"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "ureq"] }

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile = "3"

[lints]
workspace = true
