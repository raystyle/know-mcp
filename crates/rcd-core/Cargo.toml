[package]
name = "rcd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hybrid keyword+vector search core for archived code and documents"

[dependencies]
zvec-rust = "0.8.1"
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da", features = ["cuda-no-vmm"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
ignore = "0.4"
dunce = "1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "ureq"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
