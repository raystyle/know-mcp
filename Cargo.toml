[workspace]
resolver = "2"
members = ["crates/rcd-core", "crates/rcd-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "time", "sync"] }


[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[workspace.lints.rust]
unsafe_code = "warn"
unused = "warn"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
perf = "warn"
