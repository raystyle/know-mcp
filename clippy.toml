# Project-specific Clippy configuration — runs with every `cargo clippy`.
# These replace the equivalent rcd-lint rules (name-based bans need no
# custom code). Co-occurrence rules that Clippy cannot express stay in
# lints/rcd-lint.

disallowed-methods = [
    # Daemon-mutex guard: spawning the daemon via raw Command loses the
    # WMI environment echo (RCD_PORT_DIR), producing mutually-invisible
    # daemons. All daemon spawns must go through spawn_daemon_detached.
    { path = "std::process::Command::spawn", reason = "daemon spawns must use spawn_daemon_detached (WMI env echo); raw spawn breaks the single-instance mutex" },
    # Bug history: embeddings_ith returned per-token rows and produced
    # all-zero embeddings under pooling=LAST. Use embeddings_seq_ith.
    { path = "llama_cpp_2::context::LlamaContext::embeddings_ith", reason = "use embeddings_seq_ith — per-token rows are empty under pooling (all-zero embeddings bug)" },
    # zvec: delete_by_filter throws when nothing matches.
    { path = "zvec_rust::collection::Collection::delete_by_filter", reason = "throws on no-match; use deterministic pks + delete()" },
    # zvec optimize: removed 2026-11-19 — the tail-dropping bug (alibaba/zvec
    # #724) is fixed upstream and sync.rs now calls it as a controlled
    # end-of-pass step (warn-only on failure).
]
